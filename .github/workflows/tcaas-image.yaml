---
# T-CaaS bridge image publisher. See TCAAS-FORK.md.
#
# The upstream release.yaml is driven by release-please on pushes to main and
# publishes to ghcr.io/absaoss. This workflow instead publishes the T-CaaS
# bridge tags to ghcr.io/maxrink on a -telekom.N tag push. It uses only the
# built-in GITHUB_TOKEN, so it needs no organisation secrets. Delete this
# workflow together with the rest of the fork once upstream ships PRs #69/#70.
name: T-CaaS Image

on:
  push:
    tags:
      - 'v*-telekom.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to build (defaults to the triggering ref)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  GO111MODULE: "on"
  IMAGE: ghcr.io/maxrink/external-dns-infoblox-webhook

jobs:
  image:
    runs-on: ubuntu-latest
    name: Publish T-CaaS Image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      # On a tag push GITHUB_REF_NAME already is the tag. On workflow_dispatch
      # the caller must name a -telekom.N tag explicitly, otherwise the run
      # would build the default branch and publish a misleading image tag.
      - name: Resolve image tag
        id: meta
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          tag="${INPUT_REF:-$GITHUB_REF_NAME}"
          case "${tag}" in
            v*-telekom.*) ;;
            *)
              echo "refusing to publish from ref '${tag}':" \
                   "expected a v*-telekom.* tag" >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # GITHUB_SHA is the dispatching ref, not the checked-out one, so on a
          # workflow_dispatch it would stamp the default-branch commit into the
          # binary. Read the real commit out of the working tree instead.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "build/${arch}"
            cp Dockerfile "build/${arch}/Dockerfile"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -ldflags "-X 'main.Version=${{ steps.meta.outputs.tag }}' -X 'main.Gitsha=${{ steps.meta.outputs.sha }}'" \
              -o "build/${arch}/external-dns-infoblox-webhook" ./cmd/webhook
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-architecture images
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" \
              -t "${IMAGE}:${{ steps.meta.outputs.tag }}-${arch}" \
              --push "build/${arch}"
          done

      - name: Push multi-architecture manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.meta.outputs.tag }}" \
            "${IMAGE}:${{ steps.meta.outputs.tag }}-amd64" \
            "${IMAGE}:${{ steps.meta.outputs.tag }}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.tag }}"
