---
# T-CaaS bridge image publisher. See TCAAS-FORK.md.
#
# The upstream release.yaml is driven by release-please on pushes to main and
# publishes to ghcr.io/absaoss. This workflow instead publishes the T-CaaS
# bridge tags to ghcr.io/maxrink on a -telekom.N tag push. It uses only the
# built-in GITHUB_TOKEN, so it needs no organisation secrets. Delete this
# workflow together with the rest of the fork once upstream ships PRs #69/#70.
name: T-CaaS Image

on:
  push:
    tags:
      - 'v*-telekom.*'

permissions:
  contents: read
  packages: write

env:
  GO111MODULE: "on"
  IMAGE: ghcr.io/maxrink/external-dns-infoblox-webhook

jobs:
  image:
    runs-on: ubuntu-latest
    name: Publish T-CaaS Image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "build/${arch}"
            cp Dockerfile "build/${arch}/Dockerfile"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -ldflags "-X 'main.Version=${GITHUB_REF_NAME}' -X 'main.Gitsha=${GITHUB_SHA}'" \
              -o "build/${arch}/external-dns-infoblox-webhook" ./cmd/webhook
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-architecture images
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" \
              -t "${IMAGE}:${GITHUB_REF_NAME}-${arch}" \
              --push "build/${arch}"
          done

      - name: Push multi-architecture manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"
